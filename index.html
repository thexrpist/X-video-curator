<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X Curator">
<title>X Video Curator</title>
<link rel="manifest" href="manifest.webmanifest">
<script async src="https://platform.x.com/widgets.js" charset="utf-8"></script>
<style>
  :root {
    --bg: #000;
    --card: #111116;
    --border: #2a2a35;
    --text: #e8e8ef;
    --muted: #8a8a9a;
    --accent: #1d9bf0;
    --accent-hover: #1a8cd8;
    --danger: #f4212e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .container { max-width: 600px; margin: 0 auto; padding: 12px 16px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
  h1 span { color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  input, textarea, button {
    font-family: inherit;
    font-size: 1rem;
  }
  input[type="text"], input[type="password"], textarea {
    width: 100%;
    padding: 14px;
    background: #0a0a0e;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    margin: 6px 0;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    min-height: 44px;
  }
  button:active { background: var(--accent-hover); }
  button.secondary { background: #2a2a35; }
  button.danger { background: var(--danger); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }
  .video-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .video-item:last-child { border-bottom: none; }
  .video-info h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .video-info p { margin: 4px 0; color: var(--muted); font-size: 0.9rem; word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1; padding: 10px; font-size: 0.9rem; }
  .tag {
    display: inline-block;
    background: #2a2a35;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    margin-right: 6px;
  }
  .embed-container { margin-top: 10px; }
  .hidden { display: none; }
  .status { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
  .error { color: var(--danger); }
  .share-banner {
    background: #1a3a5c;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    text-align: center;
  }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 32px; padding-bottom: 20px; }

  /* Feed mode */
  #feed-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
    display: none;
    flex-direction: column;
  }
  #feed-overlay.active { display: flex; }
  #feed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: #000;
    border-bottom: 1px solid #222;
  }
  #feed-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  #feed-embed {
    width: 100%;
    max-width: 550px;
    max-height: 100%;
  }
  #feed-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: #000;
    border-top: 1px solid #222;
  }
  #feed-counter { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>X Video <span>Curator</span></h1>
    <div id="header-actions" class="hidden">
      <button id="export-btn" class="secondary">Export</button>
      <button id="lock-btn" class="secondary">Lock</button>
    </div>
  </header>

  <!-- Lock Screen -->
  <div id="lock-screen" class="card">
    <h2>Unlock Collection</h2>
    <p>Enter your master password. Shared videos will be added after unlock.</p>
    <input type="password" id="password" placeholder="Master password" autocomplete="current-password">
    <div class="row">
      <button id="unlock-btn">Unlock</button>
    </div>
    <div id="lock-status" class="status"></div>
    <input type="file" id="import-file" accept=".json,.xvc" class="hidden">
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <div id="share-banner" class="share-banner hidden">
      <strong>Shared video detected</strong>
      <p id="shared-url-preview"></p>
      <button id="confirm-share">Add to Collection</button>
    </div>

    <div class="card">
      <h2>Add Video</h2>
      <input type="text" id="url-input" placeholder="Paste X/Twitter video URL">
      <div class="row">
        <button id="paste-btn" class="secondary">Paste from Clipboard</button>
        <button id="add-btn">Add</button>
      </div>
      <input type="text" id="title-input" placeholder="Title (optional)">
      <textarea id="notes-input" placeholder="Notes or tags (comma separated)" rows="2"></textarea>
      <div id="add-status" class="status"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2 style="margin:0;">Collection <span id="count">(0)</span></h2>
        <div>
          <button id="feed-btn" class="secondary" style="padding:8px 14px; font-size:0.9rem;">Feed</button>
          <input type="text" id="search" placeholder="Search..." style="max-width:140px; margin:0; padding:10px;">
        </div>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <!-- Fullscreen Feed Overlay -->
  <div id="feed-overlay">
    <div id="feed-header">
      <button id="feed-close" class="secondary">Close</button>
      <span id="feed-counter">1 / 1</span>
      <button id="feed-next-top" class="secondary">Next</button>
    </div>
    <div id="feed-content">
      <div id="feed-embed"></div>
    </div>
    <div id="feed-nav">
      <button id="feed-prev" class="secondary">Previous</button>
      <button id="feed-next" class="secondary">Next</button>
    </div>
  </div>

  <footer>
    Encrypted · AES-256-GCM · Accepts shared X video links
  </footer>
</div>

<script>
const STORAGE_KEY = 'xvc_encrypted_v2';
const ITERATIONS = 250000;

let collection = [];
let currentPassword = '';
let pendingShareUrl = null;

// ---------- Crypto ----------
async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptData(data, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const plaintext = new TextEncoder().encode(JSON.stringify(data));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plaintext);
  return {
    salt: Array.from(salt),
    iv: Array.from(iv),
    data: Array.from(new Uint8Array(ciphertext))
  };
}

async function decryptData(envelope, password) {
  const salt = new Uint8Array(envelope.salt);
  const iv = new Uint8Array(envelope.iv);
  const ciphertext = new Uint8Array(envelope.data);
  const key = await deriveKey(password, salt);
  const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
  return JSON.parse(new TextDecoder().decode(plaintext));
}

async function saveCollection() {
  if (!currentPassword) return;
  const env = await encryptData(collection, currentPassword);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(env));
}

async function loadCollection(password) {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return [];
  const env = JSON.parse(raw);
  return await decryptData(env, password);
}

// ---------- Share Target Handling ----------
function extractSharedUrl() {
  const params = new URLSearchParams(window.location.search);
  // Support common share target params and plain ?url=
  let url = params.get('url') || params.get('link') || params.get('text');
  if (url && !url.startsWith('http')) {
    // Sometimes the URL is embedded in text
    const match = url.match(/https?:\/\/[^\s]+/);
    url = match ? match[0] : null;
  }
  if (url && (url.includes('x.com') || url.includes('twitter.com'))) {
    return url;
  }
  return null;
}

function showPendingShare() {
  if (!pendingShareUrl) return;
  const banner = document.getElementById('share-banner');
  document.getElementById('shared-url-preview').textContent = pendingShareUrl;
  banner.classList.remove('hidden');
  document.getElementById('url-input').value = pendingShareUrl;
}

// ---------- UI ----------
const $ = id => document.getElementById(id);

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&':'&','<':'<','>':'>','"':'"',"'":'&#39;'
  })[c]);
}

function renderList(filter = '') {
  const list = $('list');
  list.innerHTML = '';
  const filtered = collection.filter(v =>
    !filter ||
    (v.title || '').toLowerCase().includes(filter.toLowerCase()) ||
    (v.notes || '').toLowerCase().includes(filter.toLowerCase()) ||
    v.url.toLowerCase().includes(filter.toLowerCase())
  );
  $('count').textContent = `(${collection.length})`;

  if (filtered.length === 0) {
    list.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px 0;">No videos yet.<br>Share an X video to this app or paste a link.</p>';
    return;
  }

  filtered.forEach(v => {
    const div = document.createElement('div');
    div.className = 'video-item';
    div.innerHTML = `
      <div class="video-info">
        <h3>${escapeHtml(v.title || 'X Video')}</h3>
        <p><a href="${escapeHtml(v.url)}" target="_blank" rel="noopener">${escapeHtml(v.url)}</a></p>
        ${v.notes ? `<p>${escapeHtml(v.notes)}</p>` : ''}
        <div>${(v.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        <div class="embed-container" id="embed-${v.id}"></div>
      </div>
      <div class="actions">
        <button class="secondary" onclick="toggleEmbed('${v.id}', '${escapeHtml(v.url)}')">Embed</button>
        <button class="secondary" onclick="editItem('${v.id}')">Edit</button>
        <button class="danger" onclick="deleteItem('${v.id}')">Delete</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function toggleEmbed(id, url) {
  const container = document.getElementById('embed-' + id);
  if (container.innerHTML) {
    container.innerHTML = '';
    return;
  }
  const blockquote = document.createElement('blockquote');
  blockquote.className = 'twitter-tweet';
  blockquote.innerHTML = `<a href="${escapeHtml(url)}"></a>`;
  container.appendChild(blockquote);
  if (window.twttr && window.twttr.widgets) {
    window.twttr.widgets.load(container);
  }
}

function editItem(id) {
  const v = collection.find(x => x.id === id);
  if (!v) return;
  const newTitle = prompt('Title:', v.title || '');
  if (newTitle === null) return;
  const newNotes = prompt('Notes / tags:', v.notes || '');
  if (newNotes === null) return;
  v.title = newTitle;
  v.notes = newNotes;
  v.tags = newNotes.split(',').map(t => t.trim()).filter(Boolean);
  saveAndRender();
}

function deleteItem(id) {
  if (!confirm('Remove this video?')) return;
  collection = collection.filter(v => v.id !== id);
  saveAndRender();
}

async function saveAndRender() {
  await saveCollection();
  renderList($('search').value);
}

async function addVideo(url, title = '', notes = '') {
  if (!url || (!url.includes('x.com') && !url.includes('twitter.com'))) return false;
  const tags = notes.split(',').map(t => t.trim()).filter(Boolean);
  const item = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    url: url.trim(),
    title: title || 'X Video',
    notes,
    tags,
    added: new Date().toISOString()
  };
  collection.unshift(item);
  await saveAndRender();
  return true;
}

// ---------- Feed Mode ----------
let feedIndex = 0;
let touchStartX = 0;
let touchEndX = 0;

function openFeed(startIndex = 0) {
  if (collection.length === 0) return;
  feedIndex = startIndex;
  document.getElementById('feed-overlay').classList.add('active');
  showFeedItem();
}

function closeFeed() {
  document.getElementById('feed-overlay').classList.remove('active');
  document.getElementById('feed-embed').innerHTML = '';
}

function showFeedItem() {
  if (collection.length === 0) return;
  const item = collection[feedIndex];
  const embed = document.getElementById('feed-embed');
  embed.innerHTML = '';
  const blockquote = document.createElement('blockquote');
  blockquote.className = 'twitter-tweet';
  blockquote.setAttribute('data-dnt', 'true');
  blockquote.innerHTML = `<a href="${escapeHtml(item.url)}"></a>`;
  embed.appendChild(blockquote);
  if (window.twttr && window.twttr.widgets) {
    window.twttr.widgets.load(embed);
  }
  document.getElementById('feed-counter').textContent = `${feedIndex + 1} / ${collection.length}`;
}

function nextFeed() {
  if (collection.length === 0) return;
  feedIndex = (feedIndex + 1) % collection.length;
  showFeedItem();
}

function prevFeed() {
  if (collection.length === 0) return;
  feedIndex = (feedIndex - 1 + collection.length) % collection.length;
  showFeedItem();
}

// Swipe detection
document.getElementById('feed-content').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

document.getElementById('feed-content').addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) nextFeed();
    else prevFeed();
  }
}, { passive: true });

document.getElementById('feed-btn').onclick = () => openFeed(0);
document.getElementById('feed-close').onclick = closeFeed;
document.getElementById('feed-next').onclick = nextFeed;
document.getElementById('feed-next-top').onclick = nextFeed;
document.getElementById('feed-prev').onclick = prevFeed;

// Keyboard support
document.addEventListener('keydown', e => {
  if (!document.getElementById('feed-overlay').classList.contains('active')) return;
  if (e.key === 'ArrowRight') nextFeed();
  if (e.key === 'ArrowLeft') prevFeed();
  if (e.key === 'Escape') closeFeed();
});

// ---------- Events ----------
$('unlock-btn').onclick = async () => {
  const pw = $('password').value;
  if (!pw) return;
  $('lock-status').textContent = 'Unlocking...';
  try {
    collection = await loadCollection(pw);
    currentPassword = pw;
    $('lock-screen').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('header-actions').classList.remove('hidden');
    renderList();
    $('lock-status').textContent = '';
    showPendingShare();
  } catch (e) {
    $('lock-status').innerHTML = `<span class="error">Wrong password or no collection yet. Try again or set a new password on first use.</span>`;
  }
};

$('lock-btn').onclick = () => {
  currentPassword = '';
  collection = [];
  $('lock-screen').classList.remove('hidden');
  $('app').classList.add('hidden');
  $('header-actions').classList.add('hidden');
  $('password').value = '';
  $('share-banner').classList.add('hidden');
};

$('add-btn').onclick = async () => {
  const url = $('url-input').value.trim();
  const title = $('title-input').value.trim();
  const notes = $('notes-input').value.trim();
  if (await addVideo(url, title, notes)) {
    $('url-input').value = '';
    $('title-input').value = '';
    $('notes-input').value = '';
    $('add-status').textContent = 'Added';
    setTimeout(() => $('add-status').textContent = '', 1500);
    $('share-banner').classList.add('hidden');
    pendingShareUrl = null;
  } else {
    $('add-status').innerHTML = '<span class="error">Invalid X URL</span>';
  }
};

$('confirm-share').onclick = () => {
  if (pendingShareUrl) {
    $('url-input').value = pendingShareUrl;
    $('add-btn').click();
  }
};

$('paste-btn').onclick = async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      $('url-input').value = text.trim();
      $('add-status').textContent = 'Pasted';
    }
  } catch (e) {
    $('add-status').innerHTML = '<span class="error">Clipboard access denied. Paste manually.</span>';
  }
};

$('search').oninput = () => renderList($('search').value);

$('export-btn').onclick = async () => {
  if (!currentPassword) return;
  const env = await encryptData(collection, currentPassword);
  const blob = new Blob([JSON.stringify(env)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `x-curator-backup-${new Date().toISOString().slice(0,10)}.xvc.json`;
  a.click();
};

// Check for shared URL on load
pendingShareUrl = extractSharedUrl();
if (pendingShareUrl) {
  // Clear the query so refresh doesn't re-add
  history.replaceState(null, '', location.pathname);
}

// Register service worker for PWA (when hosted)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
